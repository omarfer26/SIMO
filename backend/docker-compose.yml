version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: retail_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-inventario_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: retail_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_HOST=db # Este es el nombre del servicio de arriba, NO localhost
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-inventario_db}
      - PORT=3000
    depends_on:
      - db

volumes:
  pgdata:
